<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    /* 마크 한 벌을 마스크로 쓰고 색만 탭 바 테마에 맞춰 뒤집는다. */
    .mark { fill: #000; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fff; } }
  </style>
  <mask id="m">
    <image href="data:image/png;base64," width="512" height="512"/>
  </mask>
  <rect class="mark" width="512" height="512" mask="url(#m)"/>
</svg>
